name: Telegram Diagnostics

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyrogram tgcrypto
      - name: Test Bot Channel Access
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION_STRING: ${{ secrets.TELEGRAM_SESSION_STRING }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 << 'EOF'
          import urllib.request, json, os

          TOKEN = os.environ.get("TELEGRAM_BOT_TOKEN")
          CID = "-1004304551882"

          # 1. Send test message via HTTP Bot API
          print(f"Testing HTTP sendMessage to {CID}...")
          try:
              data = json.dumps({"chat_id": CID, "text": "🤖 Bot connected successfully! Testing upload access..."}).encode("utf-8")
              req = urllib.request.Request(
                  f"https://api.telegram.org/bot{TOKEN}/sendMessage",
                  data=data,
                  headers={"Content-Type": "application/json"}
              )
              with urllib.request.urlopen(req) as resp:
                  res = json.loads(resp.read().decode())
                  print("✅ HTTP sendMessage SUCCESS:", res["ok"], "Message ID:", res["result"]["message_id"])
          except urllib.error.HTTPError as e:
              print(f"❌ HTTP sendMessage failed: HTTP {e.code} {e.read().decode()}")

          # 2. Test Pyrogram MTProto resolving
          from pyrogram import Client, raw

          app = Client(
              "diag_client",
              api_id=int(os.environ["TELEGRAM_API_ID"]),
              api_hash=os.environ["TELEGRAM_API_HASH"],
              session_string=os.environ["TELEGRAM_SESSION_STRING"],
              in_memory=True
          )

          with app:
              print("\nPyrogram connected. Checking MTProto access...")
              # Call updates.GetDifference to load all recent channel updates & access hashes into Pyrogram's memory!
              try:
                  diff = app.invoke(raw.functions.updates.GetDifference(pts=1, date=0, qts=0))
                  print("✅ updates.GetDifference loaded! Found chats in update:", len(getattr(diff, "chats", [])))
                  for c in getattr(diff, "chats", []):
                      print(f"   Chat in MTProto diff: {c.title} (ID: {c.id}, AccessHash: {getattr(c, 'access_hash', None)})")
              except Exception as de:
                  print(f"GetDifference note: {de}")

              # Now try get_chat
              try:
                  chat = app.get_chat(int(CID))
                  print(f"✅ Pyrogram get_chat SUCCESS! Title: {chat.title} (ID: {chat.id})")
              except Exception as pe:
                  print(f"❌ Pyrogram get_chat failed: {pe}")

          EOF
