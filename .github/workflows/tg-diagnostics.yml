name: Telegram Diagnostics

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyrogram tgcrypto
      - name: Test Invite Link Resolution
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION_STRING: ${{ secrets.TELEGRAM_SESSION_STRING }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 << 'EOF'
          import urllib.request, json, os
          from pyrogram import Client, raw

          TOKEN = os.environ.get("TELEGRAM_BOT_TOKEN")
          CID = "-1004304551882"

          # 1. Get or create invite link via HTTP API
          invite_link = None
          try:
              req = urllib.request.Request(f"https://api.telegram.org/bot{TOKEN}/exportChatInviteLink?chat_id={CID}")
              with urllib.request.urlopen(req) as resp:
                  res = json.loads(resp.read().decode())
                  invite_link = res.get("result")
                  print(f"✅ Generated invite link: {invite_link}")
          except Exception as e:
              print(f"Invite link generation failed: {e}")

          # 2. Test in Pyrogram
          app = Client(
              "diag_client",
              api_id=int(os.environ["TELEGRAM_API_ID"]),
              api_hash=os.environ["TELEGRAM_API_HASH"],
              session_string=os.environ["TELEGRAM_SESSION_STRING"],
              in_memory=True
          )

          with app:
              if invite_link:
                  print("Testing app.get_chat(invite_link)...")
                  try:
                      chat = app.get_chat(invite_link)
                      print(f"✅ Successfully resolved via invite link: {chat.title} (ID: {chat.id})")
                      
                      # Now test sending a test document
                      import tempfile
                      with tempfile.NamedTemporaryFile(suffix=".txt", delete=False) as tf:
                          tf.write(b"Test upload payload from Stream-Recorder")
                          tf_path = tf.name
                      
                      doc = app.send_document(chat.id, tf_path, caption="Test upload verification")
                      print(f"🎉 MTPROTO UPLOAD SUCCESS! Message ID: {doc.id}")
                      os.remove(tf_path)
                  except Exception as e:
                      print(f"❌ Invite link resolution failed: {e}")
              else:
                  print("No invite link available.")

          EOF
