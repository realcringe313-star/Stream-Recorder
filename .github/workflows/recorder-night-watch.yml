# ─────────────────────────────────────────────────────────────────────────────
#  RECORDER NIGHT WATCH
#  Keeps the Stream Recorder running continuously through the Pakistan night
#  window without depending on GitHub's throttled */5 cron or an external
#  cron-job.org pinger.
#
#  2026-11-22 incident: a livestream started at 1:52 AM PKT, but GitHub delayed
#  the recorder's high-frequency schedule until 3:26 AM. The old night-watch
#  workflow only had three late bootstrap slots and was itself delayed. Result:
#  the live stream was never checked, so there was no recording and no failure
#  notification.
#
#  The fix has two independent layers:
#    1. Several overlapping low-frequency bootstrap slots start before the
#       observed 1:52 AM stream window, beginning at 6:20 PM PKT.
#    2. Every completed Stream Recorder run triggers this workflow through
#       `workflow_run` (not the throttled scheduler), which starts the next
#       recorder immediately. Once bootstrapped, coverage stays continuous
#       until the 7 AM PKT cutoff without relying on */5 cron.
#
#  This is a companion, not a replacement: the recorder's own schedule remains
#  as a fallback. All dispatches go through the same concurrency group, so the
#  recorder still records only one stream at a time.
# ─────────────────────────────────────────────────────────────────────────────

name: "Recorder night watch"

on:
  schedule:
    # PKT is UTC+5. These overlapping slots bracket the observed 1:52 AM
    # stream window; any one of them can bootstrap the event-driven chain.
    - cron: "20 13 * * *"  # 6:20 PM PKT
    - cron: "20 15 * * *"  # 8:20 PM PKT
    - cron: "20 17 * * *"  # 10:20 PM PKT
    - cron: "20 19 * * *"  # 12:20 AM PKT
    - cron: "20 21 * * *"  # 2:20 AM PKT
    - cron: "20 23 * * *"  # 4:20 AM PKT
  # This is the high-reliability bootstrap continuation. `workflow_run` is an
  # event trigger, not a schedule, so GitHub cron throttling cannot leave a gap
  # between one recorder run ending and the next one starting at night.
  workflow_run:
    workflows: ["Stream Recorder"]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: recorder-night-watch
  cancel-in-progress: true

env:
  TZ: Asia/Karachi
  GH_PAT: ${{ secrets.GH_PAT }}

jobs:
  watch:
    name: "Keep recorder dispatching"
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:
      - name: "Dispatch recorder while it is night in Pakistan"
        run: |
          set -u

          if [[ -z "${GH_PAT:-}" ]]; then
            echo "::error::GH_PAT is not set; cannot dispatch the recorder."
            exit 1
          fi

          API="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions"
          AUTH=(-H "Authorization: Bearer ${GH_PAT}" -H "Accept: application/vnd.github+json")

          # Leave a 20-minute cushion under the 350-minute job timeout.
          END=$(( $(date +%s) + 5 * 3600 + 30 * 60 ))

          while (( $(date +%s) < END )); do
            H=$(date -u +%-H)

            # 02:00-15:59 UTC = 7 AM-8:59 PM PKT. Stop; the recorder schedule
            # itself is silent in this window too.
            if (( H >= 2 && H < 16 )); then
              echo "Daytime ($(( (H + 5) % 24 )):00 PKT) — night watch finished."
              break
            fi

            # Ask GitHub whether a recorder run is already active or queued.
            # On an API error, skip the dispatch (never blind-fire runs).
            RUNS_JSON=$(curl -fsS --max-time 30 "${AUTH[@]}" \
              "${API}/workflows/stream-recorder.yml/runs?per_page=10" 2>/dev/null) || {
              echo "[$(date '+%F %T %Z')] GitHub API read failed — not dispatching this pass."
              sleep 300
              continue
            }

            ACTIVE=$(printf '%s' "$RUNS_JSON" | jq -r '
              [.workflow_runs[]
               | select(.status == "in_progress"
                        or .status == "queued"
                        or .status == "waiting"
                        or .status == "requested"
                        or .status == "pending")] | length
            ' 2>/dev/null) || ACTIVE="unknown"

            if [[ "$ACTIVE" == "0" ]]; then
              CODE=$(curl -sS --max-time 30 -o /tmp/dispatch.out -w "%{http_code}" \
                -X POST "${AUTH[@]}" \
                -H "Content-Type: application/json" \
                "${API}/workflows/stream-recorder.yml/dispatches" \
                -d '{"ref":"main","inputs":{"wait_for_live":"true","wait_max_hours":"1"}}') || CODE="000"

              echo "[$(date '+%F %T %Z')] No active recorder run — dispatch HTTP ${CODE}"
              if [[ "$CODE" != "204" ]]; then
                echo "::warning::Recorder dispatch failed (HTTP ${CODE})"
                cat /tmp/dispatch.out 2>/dev/null || true
              fi
            elif [[ "$ACTIVE" == "unknown" ]]; then
              echo "[$(date '+%F %T %Z')] Could not parse recorder run list — skipping dispatch."
            else
              echo "[$(date '+%F %T %Z')] Recorder already active/queued (${ACTIVE}) — waiting."
            fi

            # workflow_run normally replaces this watcher within seconds of a
            # recorder finishing. Keep the fallback poll short so a missed event
            # cannot create a meaningful coverage gap.
            sleep 120
          done

          echo "Night watch ended at $(date '+%F %T %Z')."
