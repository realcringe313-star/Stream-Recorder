name: Generate Telegram Session

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyrogram tgcrypto pynacl
      - name: Generate and Save Session String
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          python3 << 'EOF'
          import urllib.request, json, base64
          from nacl import encoding, public
          from pyrogram import Client

          BOT_TOKEN = "8619444770:AAFLDk1mag6kNn3xj0sSA74FNULLm0zG3Bw"
          API_ID = 30156787
          API_HASH = "b4c75044ad3b41306bd03d367b37fbb1"
          REPO = "realcringe313-star/Stream-Recorder"
          import os
          TOKEN = os.environ.get("GH_PAT")

          print("Connecting to Telegram via Pyrogram...")
          app = Client("bot_session", api_id=API_ID, api_hash=API_HASH, bot_token=BOT_TOKEN, in_memory=True)
          with app:
              session_str = app.export_session_string()
              me = app.get_me()
              print(f"Logged in as Telegram bot: @{me.username} ({me.id})")

          print(f"Session string generated! Length: {len(session_str)}")

          # Save secret to GitHub
          def set_repo_secret(name, value):
              # Get public key
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{REPO}/actions/secrets/public-key",
                  headers={"Authorization": f"token {TOKEN}", "Accept": "application/vnd.github.v3+json", "User-Agent": "Mozilla/5.0"}
              )
              with urllib.request.urlopen(req) as resp:
                  pk_data = json.loads(resp.read().decode())

              pk = public.PublicKey(pk_data["key"].encode("utf-8"), encoding.Base64Encoder)
              box = public.SealedBox(pk)
              enc = box.encrypt(value.encode("utf-8"))
              b64_enc = base64.b64encode(enc).decode("utf-8")

              payload = json.dumps({"encrypted_value": b64_enc, "key_id": pk_data["key_id"]}).encode("utf-8")
              put_req = urllib.request.Request(
                  f"https://api.github.com/repos/{REPO}/actions/secrets/{name}",
                  data=payload,
                  method="PUT",
                  headers={"Authorization": f"token {TOKEN}", "Accept": "application/vnd.github.v3+json", "Content-Type": "application/json"}
              )
              with urllib.request.urlopen(put_req) as resp:
                  print(f"Saved secret {name}: HTTP {resp.status}")

          set_repo_secret("TELEGRAM_SESSION_STRING", session_str)
          set_repo_secret("TELEGRAM_BOT_TOKEN", BOT_TOKEN)
          print("All Telegram secrets successfully saved to GitHub!")
          EOF
