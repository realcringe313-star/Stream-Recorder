# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║   RECORDER COVERAGE WATCHDOG                                                ║
# ║  Watches whether the Stream Recorder has an active run during the Pakistan  ║
# ║  night window. The 2026-11-22 incident was green because no recorder run    ║
# ║  was created at 1:52 AM, so recording-level error handlers were never       ║
# ║  reached. This watchdog alerts on the missing run itself, regardless of     ║
# ║  whether it came from schedule, workflow_dispatch, or repository_dispatch.  ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

name: "Pinger watchdog"

on:
  schedule:
    # Every 30 minutes (two slots per hour, offset to clear the pinger cadence)
    - cron: "23,53 * * * *"
  # Event-driven checks make a broken night-watch chain visible immediately.
  workflow_run:
    workflows: ["Stream Recorder", "Recorder night watch"]
    types: [completed]
  workflow_dispatch:
    inputs:
      quiet_minutes:
        description: "Alert if there is no active/recent recorder run in this many minutes"
        required: false
        default: "20"
        type: string

permissions:
  actions: read

defaults:
  run:
    shell: bash

concurrency:
  group: pinger-watchdog
  cancel-in-progress: true

env:
  DISCORD_WEBHOOK_ALERTS: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
  DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
  AVATAR_URL: ${{ secrets.AVATAR_URL }}

jobs:
  watchdog:
    name: "Check recorder heartbeat"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: "Checkout"
        uses: actions/checkout@v7

      - name: "Check stream-recorder coverage"
        id: check
        env:
          QUIET_MINUTES: ${{ inputs.quiet_minutes || '20' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          BASE="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/stream-recorder.yml/runs"
          auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json")

          H=$(date -u +%-H)
          if (( H >= 2 && H < 16 )); then
            echo "Night coverage is intentionally paused during daytime PKT."
            echo "age=paused" >> "$GITHUB_OUTPUT"
            echo "alert=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          RUNS_JSON=$(curl -fsS --max-time 30 "${auth[@]}" "${BASE}?per_page=20" 2>/dev/null) || {
            echo "age=unknown" >> "$GITHUB_OUTPUT"
            echo "alert=no" >> "$GITHUB_OUTPUT"
            echo "::warning::Could not read recorder run history; watchdog will retry."
            exit 0
          }

          ACTIVE=$(printf '%s' "$RUNS_JSON" | jq -r '
            [.workflow_runs[]
             | select(.status == "in_progress"
                      or .status == "queued"
                      or .status == "waiting"
                      or .status == "requested"
                      or .status == "pending")] | length
          ' 2>/dev/null) || ACTIVE="unknown"
          LATEST=$(printf '%s' "$RUNS_JSON" | jq -r '.workflow_runs[0].created_at // empty' 2>/dev/null || true)

          if [[ "$ACTIVE" =~ ^[1-9][0-9]*$ ]]; then
            AGE="active(${ACTIVE})"
          elif [[ -z "$LATEST" ]]; then
            AGE="NEVER"
          else
            AGE_MIN=$(( ($(date +%s) - $(date -d "$LATEST" +%s 2>/dev/null || echo 0)) / 60 ))
            AGE="${AGE_MIN}m"
          fi
          echo "age=${AGE}" >> "$GITHUB_OUTPUT"

          ALERT="no"
          REASON=""
          case "$AGE" in
            active*)
              ;;
            NEVER)
              ALERT="yes"
              REASON="stream-recorder has no run history at all during the night window."
              ;;
            *)
              AGE_MIN="${AGE%m}"
              if [[ "$AGE_MIN" =~ ^[0-9]+$ ]] && (( AGE_MIN > QUIET_MINUTES )); then
                ALERT="yes"
                REASON="stream-recorder coverage LOST — no active run and the latest run started ${AGE_MIN} min ago (quiet window: ${QUIET_MINUTES})."
              fi
              ;;
          esac
          echo "alert=$ALERT" >> "$GITHUB_OUTPUT"
          printf '%s' "$REASON" > /tmp/watchdog-reason.txt
          if [[ -n "$REASON" ]]; then echo "reason: $REASON" >> "$GITHUB_STEP_SUMMARY"; else echo "heartbeat ok (last dispatch ${AGE} min ago)" >> "$GITHUB_STEP_SUMMARY"; fi

      - name: "🚨 Alert — recorder coverage degrading"
        if: steps.check.outputs.alert == 'yes'
        run: |
          MSG="🚨 **Recorder coverage watchdog**:"$'\n'"$(cat /tmp/watchdog-reason.txt)"$'\n'"If a stream goes live now it could be missed. Check the Recorder night watch chain and GitHub Actions."
          echo "$MSG" >> "$GITHUB_STEP_SUMMARY"
          WEBHOOK="${DISCORD_WEBHOOK_ALERTS:-${DISCORD_WEBHOOK_URL:-}}"
          if [[ -n "$WEBHOOK" ]]; then
            curl -fsS -X POST "$WEBHOOK" -H "Content-Type: application/json" \
              -d "$(jq -n --arg m "$MSG" --arg a "${AVATAR_URL:-}" \
                '{content: $m, username: "Pinger Watchdog", avatar_url: $a}')" >/dev/null 2>&1 || echo "discord send failed"
          fi

      - name: "✅ Heartbeat OK"
        if: steps.check.outputs.alert == 'no'
        run: |
          echo "Recorder dispatch heartbeat healthy — status: ${{ steps.check.outputs.age }}."
