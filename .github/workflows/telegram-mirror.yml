name: Telegram mirror

on:
  workflow_run:
    workflows: ["Stream Recorder", "Go-live sniper"]
    types: [completed]
  workflow_dispatch:
    inputs:
      force_all:
        description: "Re-upload ALL recordings (even if they already have telegram_link)"
        required: false
        type: boolean
        default: true
      clean_channel:
        description: "Delete all old messages from the channel before uploading"
        required: false
        type: boolean
        default: true

concurrency:
  group: telegram-mirror
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  upload-all:
    runs-on: ubuntu-24.04
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install pyrogram tgcrypto

      - name: Upload ALL recordings to Telegram
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION_STRING: ${{ secrets.TELEGRAM_SESSION_STRING }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FORCE_ALL: ${{ inputs.force_all || github.event.inputs.force_all || 'false' }}
          CLEAN_CHANNEL: ${{ inputs.clean_channel || github.event.inputs.clean_channel || 'false' }}
        run: |
          python3 << 'PYSCRIPT'
          import json, os, subprocess, sys

          # Patch Pyrogram 32-bit channel ID limit for modern Telegram 64-bit IDs
          import pyrogram.utils
          pyrogram.utils.MIN_CHANNEL_ID = -100999999999999

          with open("data/recordings.json") as f:
              recs = json.load(f)

          force_all = os.environ.get("FORCE_ALL", "false").lower() == "true"
          clean_channel = os.environ.get("CLEAN_CHANNEL", "false").lower() == "true"

          api_id = os.environ.get("TELEGRAM_API_ID", "")
          api_hash = os.environ.get("TELEGRAM_API_HASH", "")
          session = os.environ.get("TELEGRAM_SESSION_STRING", "")
          raw_chat = os.environ.get("TELEGRAM_CHAT_ID", "0").strip()

          if not all([api_id, api_hash, session]):
              print("❌ Telegram credentials missing in secrets!")
              sys.exit(1)

          from pyrogram import Client

          app = Client(
              "mirror_worker",
              api_id=int(api_id),
              api_hash=api_hash,
              session_string=session,
              in_memory=True
          )

          # Optional: Clean old messages from the channel
          if clean_channel:
              print("\n" + "=" * 60)
              print("🧹 CLEANING OLD MESSAGES FROM CHANNEL...")
              print("=" * 60)
              try:
                  with app:
                      # Resolve chat id
                      candidates = []
                      if raw_chat.startswith("-100"): candidates.append(int(raw_chat))
                      elif raw_chat.lstrip("-").isdigit():
                          candidates.extend([int(f"-100{raw_chat}"), int(raw_chat), int(f"-{raw_chat}")])
                      
                      target_cid = None
                      for cid in candidates:
                          try:
                              chat_info = app.get_chat(cid)
                              print(f"Connected to chat: {getattr(chat_info, 'title', cid)} (ID: {cid})")
                              target_cid = cid
                              break
                          except Exception as ce:
                              print(f"Candidate {cid} failed: {ce}")

                      if target_cid:
                          total_deleted = 0
                          for start_id in range(1, 1000, 100):
                              del_ids = list(range(start_id, start_id + 100))
                              try:
                                  deleted_count = app.delete_messages(target_cid, del_ids)
                                  if deleted_count:
                                      total_deleted += deleted_count
                                      print(f"Deleted batch {start_id}-{start_id+99}: {deleted_count} message(s) removed.")
                              except Exception as de:
                                  print(f"Delete batch {start_id} note: {de}")
                          print(f"Total old messages deleted: {total_deleted}")
                      else:
                          print("⚠️ Could not resolve target chat for cleaning.")
              except Exception as e:
                  print(f"⚠️ Message cleanup encountered an issue (continuing with upload): {e}")

          # Determine what to upload
          if force_all:
              print("\n🔥 FORCE_ALL requested: Clearing old telegram links and queuing all recordings chronologically (oldest first).")
              for r in recs:
                  r["telegram_link"] = ""
                  r["telegram_file_id"] = ""
              todo = list(reversed(recs))  # oldest first!
          else:
              todo = [r for r in recs if not r.get("telegram_link") and (r.get("archive_direct") or r.get("archive_node") or r.get("archive_link"))]

          if not todo:
              print("✅ All recordings already have Telegram links. Nothing to upload.")
              sys.exit(0)

          print(f"Found {len(todo)} recording(s) to upload to Telegram\n")

          failures = []

          for i, rec in enumerate(todo):
              title = rec.get("title", "Recording")
              vid = rec.get("video_id", "")
              url = rec.get("archive_direct") or rec.get("archive_node") or ""
              if not url and rec.get("archive_link"):
                  url = rec["archive_link"].replace("/details/", "/download/") + "/"

              print(f"\n{'='*60}")
              print(f"[{i+1}/{len(todo)}] Uploading: {title} ({vid})")
              print(f"Source: {url}")

              safe = "".join(c if c.isalnum() or c in "._-" else "_" for c in title[:60]) + ".mp4"
              path = f"/tmp/{safe}"

              print("  1. Downloading from Archive.org...")
              dl = subprocess.run(["curl", "-L", "--retry", "3", "--max-time", "3600", "-o", path, url], capture_output=True)
              if dl.returncode != 0 or not os.path.exists(path) or os.path.getsize(path) < 10000:
                  print(f"  ❌ Download failed: returncode={dl.returncode}")
                  failures.append((vid, title, "download failed"))
                  continue

              size = os.path.getsize(path)
              print(f"  2. Downloaded: {size/1024/1024:.1f} MB. Uploading to Telegram...")

              env = os.environ.copy()
              env["GITHUB_OUTPUT"] = f"/tmp/tg_out_{vid}.txt"
              open(env["GITHUB_OUTPUT"], "w").close()

              up = subprocess.run(
                  ["python3", "scripts/telegram/upload_to_telegram.py", path, title],
                  env=env
              )

              tg_link = ""
              tg_file_id = ""
              try:
                  with open(env["GITHUB_OUTPUT"]) as out_f:
                      for line in out_f:
                          if line.startswith("telegram_link="):
                              tg_link = line.strip().split("=", 1)[1]
                          elif line.startswith("telegram_file_id="):
                              tg_file_id = line.strip().split("=", 1)[1]
              except Exception as oe:
                  print(f"  Could not read output: {oe}")

              if tg_link:
                  import urllib.parse
                  for r in recs:
                      if r.get("video_id") == vid:
                          r["telegram_link"] = tg_link
                          if tg_file_id:
                              r["telegram_file_id"] = tg_file_id
                              r["cf_stream"] = f"https://tg-stream.isthatdxture.workers.dev/?file_id={urllib.parse.quote(tg_file_id, safe='')}"
                          break
                  with open("data/recordings.json", "w") as f:
                      json.dump(recs, f, indent=2)
                  print(f"  ✅ Uploaded successfully! Link: {tg_link}")
              else:
                  failures.append((vid, title, f"upload returned {up.returncode}"))
                  print(f"  ❌ Upload failed (rc={up.returncode})")

              try:
                  os.remove(path)
              except Exception:
                  pass

          print(f"\n{'='*60}\nAll done!")

          if failures:
              seen = set()
              uniq = []
              for vid, title, reason in failures:
                  if vid not in seen:
                      seen.add(vid)
                      uniq.append((vid, title, reason))
              with open("/tmp/tg_failures.txt", "w") as f:
                  for vid, title, reason in uniq:
                      f.write(f"{vid} | {title} | {reason}\n")
              print(f"⚠️ {len(uniq)} recording(s) failed to upload.")
              sys.exit(1)
          PYSCRIPT

      - name: Commit & push updated links
        if: always()
        run: |
          git config user.name "Stream Recorder Bot"
          git config user.email "bot@stream-recorder"
          git add data/recordings.json
          git diff --cached --quiet || {
            git commit -m "Telegram: uploaded recordings and updated links"
            bash scripts/safe-push.sh
          }

      - name: Alert if any Telegram upload failed
        if: always()
        env:
          DISCORD_WEBHOOK_ALERTS: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          AVATAR_URL: ${{ secrets.AVATAR_URL }}
        run: |
          if [[ -f /tmp/tg_failures.txt ]]; then
            FAILURES="$(cat /tmp/tg_failures.txt)"
            echo "## Telegram upload failures" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "$FAILURES" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            MSG="⚠️ **Telegram mirror**: some recordings failed to upload to Telegram:\n\`\`\`\n$FAILURES\n\`\`\`"
            WEBHOOK="${DISCORD_WEBHOOK_ALERTS:-${DISCORD_WEBHOOK_URL:-}}"
            if [[ -n "$WEBHOOK" ]]; then
              curl -fsS -X POST "$WEBHOOK" -H "Content-Type: application/json" \
                -d "$(jq -n --arg m "$MSG" --arg a "${AVATAR_URL:-}" '{content:$m, avatar_url:$a}')" \
                >/dev/null 2>&1 || echo "discord send failed"
            fi
            exit 1
          else
            echo "All recordings uploaded to Telegram successfully"
          fi
